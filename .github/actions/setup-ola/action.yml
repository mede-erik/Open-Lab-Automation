name: Set up Open Lab Automation
description: >
  Python, the system packages Qt needs to run offscreen (and gcc, which the Rust build links with), and the Python
  dependencies of requirements.txt plus the CI test tools. Works on GitHub-hosted runners and
  on self-hosted Linux runners (see docs/CI.md for what a self-hosted runner must provide).

inputs:
  python-version:
    description: Python version for actions/setup-python
    default: "3.12"
  working-directory:
    description: Directory that contains requirements.txt
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt

    - name: Install system packages (Qt offscreen, gcc for the Rust build)
      shell: bash
      env:
        RUNNER_KIND: ${{ runner.environment }}
      run: |
        PKGS="libxcb-cursor0 libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 gcc"
        if [ "$(uname -s)" != "Linux" ]; then
          echo "Not Linux: system packages are not installed by this action"
        elif [ "$RUNNER_KIND" = "github-hosted" ] || sudo -n true 2>/dev/null; then
          # The runner image may already have them: no network needed then
          missing=""
          for pkg in $PKGS; do dpkg -s "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"; done
          if [ -z "$missing" ]; then
            echo "All system packages are installed already"
          else
            # Short timeouts and retries: a mirror that does not answer fails in seconds, not minutes
            apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
            ok=0
            for attempt in 1 2 3; do
              if sudo apt-get $apt_opts update -qq && \
                 sudo apt-get $apt_opts install -y -qq --no-install-recommends $PKGS; then
                ok=1
                break
              fi
              echo "::warning::apt failed (attempt $attempt of 3), trying again"
              sleep $((attempt * 20))
            done
            if [ "$ok" != 1 ]; then
              echo "::error::apt cannot install $PKGS from the runner's mirrors (network or DNS of the runner image)"
              exit 1
            fi
          fi
        else
          echo "::warning::self-hosted runner without passwordless sudo: make sure these packages are installed: $PKGS"
        fi

    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-timeout flake8
