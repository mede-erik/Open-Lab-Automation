name: Set up Open Lab Automation
description: >
  Python, the system packages Qt needs to run offscreen (and a C compiler), and the Python
  dependencies of requirements.txt plus the CI test tools. Works on GitHub-hosted runners and
  on self-hosted Linux runners (see docs/CI.md for what a self-hosted runner must provide).

inputs:
  python-version:
    description: Python version for actions/setup-python
    default: "3.12"
  working-directory:
    description: Directory that contains requirements.txt
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ inputs.working-directory }}/requirements.txt

    - name: Install system packages (Qt offscreen, C compiler)
      shell: bash
      env:
        RUNNER_KIND: ${{ runner.environment }}
      run: |
        PKGS="libxcb-cursor0 libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 gcc make"
        if [ "$(uname -s)" != "Linux" ]; then
          echo "Not Linux: system packages are not installed by this action"
        elif [ "$RUNNER_KIND" = "github-hosted" ] || sudo -n true 2>/dev/null; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends $PKGS
        else
          echo "::warning::self-hosted runner without passwordless sudo: make sure these packages are installed: $PKGS"
        fi

    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-timeout flake8
