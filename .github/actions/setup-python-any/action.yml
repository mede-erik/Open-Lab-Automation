name: Set up Python (GitHub-hosted or self-hosted)
description: >
  A Python of the requested version, on any runner. On GitHub-hosted runners it is
  actions/setup-python. On a self-hosted runner that is not in the tool cache of
  actions/setup-python (for example Debian 13, where no Python 3.12 is published for that
  image), uv downloads the version and creates a virtual environment, which becomes the first
  python and pip on the PATH of the later steps of the job.

inputs:
  python-version:
    description: Python version, for example "3.12"
    required: true
  cache-dependency-path:
    description: File whose hash keys the pip cache (GitHub-hosted runners only)
    default: ""

runs:
  using: composite
  steps:
    - name: Python ${{ inputs.python-version }} (GitHub-hosted runner)
      if: runner.environment == 'github-hosted'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache-dependency-path != '' && 'pip' || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    # uv from its release, pinned and checked against its SHA256 (the repository only allows
    # some third-party actions, so astral-sh/setup-uv is not used)
    - name: Install uv 0.9.5 (self-hosted runner, checksum verified)
      if: runner.environment != 'github-hosted'
      shell: bash
      env:
        UV_VERSION: "0.9.5"
        UV_SHA256: "2cf10babba653310606f8b49876cfb679928669e7ddaa1fb41fb00ce73e64f66"
      run: |
        dir="$RUNNER_TEMP/uv-bin"
        mkdir -p "$dir"
        url="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
        curl -fsSL -o "$dir/uv.tar.gz" "$url"
        echo "${UV_SHA256}  $dir/uv.tar.gz" | sha256sum -c -
        tar -xzf "$dir/uv.tar.gz" -C "$dir" --strip-components=1
        echo "$dir" >> "$GITHUB_PATH"

    - name: Python ${{ inputs.python-version }} in a virtual environment (self-hosted runner)
      if: runner.environment != 'github-hosted'
      shell: bash
      env:
        PYVER: ${{ inputs.python-version }}
      run: |
        uv python install "$PYVER"
        venv="$RUNNER_TEMP/ola-python-$PYVER"
        uv venv --seed --python "$PYVER" "$venv"  # --seed: pip, which the later steps use
        echo "$venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"
        "$venv/bin/python" --version
