name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libgl1-mesa-glx

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Validate translations
        run: python scripts/check_translations.py

      - name: Lint
        run: flake8 --max-line-length=100 .

      - name: Build C backend
        run: bash backend/build.sh

      - name: Test import
        run: python -m pytest test_basic_import.py -v

      - name: Test C backend load
        run: python -c "from frontend.core.c_backend import CBackend; CBackend.load(); CBackend.unload(); print('C backend OK')"
