name: CI

# Runs on every push (any branch except main and the version tags) and on every pull request.
# On main and on the tags vX.Y.Z the workflow "Package" calls this one first (workflow_call) and
# builds the packages only if everything passes; running it here too would test the same commit
# twice. See docs/CI.md.
#
# Runner: GitHub-hosted by default. To move the jobs to a self-hosted runner set the repository
# variable CI_RUNS_ON (Settings > Secrets and variables > Actions > Variables) to a JSON
# value, for example  ["self-hosted", "linux", "x64"]  or  "my-runner-label".
# See docs/CI.md.

on:
  push:
    branches-ignore: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint and translations
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        run: python -m pip install flake8

      - name: Validate translations
        run: python scripts/check_translations.py

      # New code (ola/, tests/, scripts/) must be clean; settings are in .flake8
      - name: Lint new code
        run: flake8 ola tests scripts

      # Real errors (syntax errors, undefined names) in the whole repository
      - name: Lint critical errors
        run: flake8 --select=E9,F63,F7,F82 .

      # Style debt of the older code: reported, does not fail the build
      - name: Lint style report (legacy code)
        run: flake8 --exit-zero --statistics -qq .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instrument library revision
        run: git submodule status

      - uses: ./.github/actions/setup-ola
        with:
          python-version: ${{ matrix.python-version }}

      # Engine, library integrity, frontend core, scripts and GUI smoke tests.
      # --timeout stops a test that hangs (a modal dialog, a socket) instead of the runner.
      - name: Run test suite
        run: >
          python -m pytest -ra --timeout=120
          --junitxml=test-results/junit-${{ matrix.python-version }}.xml
          --cov=ola --cov=frontend --cov=scripts
          --cov-report=term --cov-report=xml:test-results/coverage-${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 14

  native:
    name: Native transport (Rust)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Rust tests
        working-directory: native
        run: cargo test --locked

      # Style of the existing Rust code: reported, does not fail the build (yet)
      - name: rustfmt / clippy report
        working-directory: native
        continue-on-error: true
        run: |
          cargo fmt --check
          cargo clippy --all-targets --features python -- -D warnings

      - uses: ./.github/actions/setup-ola
        with:
          python-version: "3.12"

      - name: Build and install the Python module
        run: |
          pip install "maturin>=1.5,<2"
          (cd native && maturin build --release --locked)
          pip install native/target/wheels/ola_native-*.whl
          python -c "import ola.transport as t; assert t.BACKEND == 'native', t.BACKEND; print('transport:', t.BACKEND)"

      # The same Python suite, now with the native transport (serial/pty tests included)
      - name: Python tests with the native transport
        run: python -m pytest tests -ra --timeout=120

  postgres:
    # Measurement storage (frontend/core/ProjectDatabaseManager.py) against a real server.
    # Service containers need Docker on the runner: on a self-hosted runner without Docker
    # set the repository variable CI_SKIP_POSTGRES to "true".
    name: Project database (PostgreSQL)
    if: vars.CI_SKIP_POSTGRES != 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OLA_TEST_POSTGRES: "host=127.0.0.1 port=5432 user=postgres password=postgres"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ola
        with:
          python-version: "3.12"

      - name: Database tests
        run: python -m pytest tests/test_project_database.py -ra --timeout=120

  library-main:
    # Early warning: the application against the newest library on Instruments_LIB main
    # (the submodule is pinned; this shows what will break at the next submodule update).
    name: Against Instruments_LIB main (informational)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Move the library to its main branch
        run: |
          git -C Instruments_LIB fetch --depth=1 origin main
          git -C Instruments_LIB checkout --detach FETCH_HEAD
          git -C Instruments_LIB log -1 --oneline

      - uses: ./.github/actions/setup-ola
        with:
          python-version: "3.12"

      - name: Run test suite
        run: python -m pytest tests -ra --timeout=120
