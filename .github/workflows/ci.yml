name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor0 libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Validate translations
        run: python scripts/check_translations.py

      # New code (ola/, tests/, scripts/) must be clean; settings are in .flake8
      - name: Lint new code
        run: flake8 ola tests scripts

      # Real errors (syntax errors, undefined names) in the whole repository
      - name: Lint critical errors
        run: flake8 --select=E9,F63,F7,F82 .

      # Style debt of the older code: reported, does not fail the build
      - name: Lint style report (legacy code)
        run: flake8 --exit-zero --statistics -qq .

      - name: Build C backend
        run: bash backend/build.sh

      - name: Test import
        run: python -m pytest test_basic_import.py -v

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Test C backend load
        run: python -c "from frontend.core.c_backend import CBackend; CBackend.load(); CBackend.unload(); print('C backend OK')"
