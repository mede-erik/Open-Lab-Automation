name: Package

# Builds the installable packages and publishes them as GitHub releases:
#
#   push to main      -> the release "nightly" (a pre-release) is updated with the packages of the
#                        newest commit of main
#   push of a tag     -> a fixed release for the tag: vX.Y.Z (the tag must agree with the version
#                        in pyproject.toml); vX.Y.Z-rc1 gives a pre-release
#   manual run        -> the same packages as artifacts of the run, nothing is published
#
# The tests of ci.yml run first (workflow_call): no package is built from a red commit.
# They follow the runner rules of ci.yml (CI_RUNS_ON and CI_TRUSTED_ACTORS): on the self-hosted
# runner only for the trusted authors.
#
# Windows : zip + installer (Inno Setup)
# Linux   : tar.gz + .deb + .rpm (nfpm); the PKGBUILD for Arch Linux lives in packaging/arch/
#           and is only checked here, Arch users build it themselves
#
# See packaging/README.md. Runners: the build jobs use GitHub-hosted runners (the Linux bundle
# must be built on the oldest image, for the glibc). Repository variables PACKAGE_RUNS_ON_LINUX
# and PACKAGE_RUNS_ON_WINDOWS (JSON, like CI_RUNS_ON) move them to self-hosted runners; leave
# them unset unless the runner has the same OS image, sudo and Docker.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  # A newer commit of main makes an older build useless; a release is never cancelled
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  NFPM_VERSION: "2.43.0"

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  meta:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.version.outputs.kind }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version of the packages
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            kind=release
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            kind=nightly
            tag=""
          else
            kind=dev
            tag=""
          fi
          python3 scripts/build_package.py version --kind "$kind" --tag "$tag" --sha "$GITHUB_SHA" \
            | tee -a "$GITHUB_OUTPUT"

  windows:
    name: Windows (zip, installer)
    needs: [tests, meta]
    runs-on: ${{ fromJSON(vars.PACKAGE_RUNS_ON_WINDOWS || '"windows-latest"') }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install the build tools
        run: pip install -r requirements.txt -r packaging/requirements.txt

      # Rust transport + PyInstaller + self-test of the frozen program
      - name: Build the bundle
        run: python scripts/build_package.py bundle --native

      - name: Zip
        run: python scripts/build_package.py archive --version "$VERSION"

      - name: Make sure Inno Setup is installed
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --no-progress -y
          fi

      - name: Installer
        run: python scripts/build_package.py installer --version "$VERSION"

      - name: Test the installer (silent install, self-test of the installed program, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-release\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -Wait -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DIR=C:\ola-test', "/LOG=$env:RUNNER_TEMP\setup.log"
          if (-not (Test-Path C:\ola-test\OpenLabAutomation.exe)) {
            Get-Content "$env:RUNNER_TEMP\setup.log" -ErrorAction SilentlyContinue
            throw "the installer did not install the program"
          }
          $env:QT_QPA_PLATFORM = 'offscreen'
          & C:\ola-test\ola-selftest.exe --expect-native
          if ($LASTEXITCODE -ne 0) { throw "self-test of the installed program failed" }
          Start-Process -FilePath C:\ola-test\unins000.exe -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          if (Test-Path C:\ola-test\OpenLabAutomation.exe) { throw "the uninstaller left the program" }

      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (tar.gz, deb, rpm)
    needs: [tests, meta]
    # The oldest runner image: the bundle needs a glibc at least as new as the one it was built on
    runs-on: ${{ fromJSON(vars.PACKAGE_RUNS_ON_LINUX || '"ubuntu-22.04"') }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install system packages (Qt, for the self-test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxcb-cursor0 libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0

      - name: Install the build tools
        run: pip install -r requirements.txt -r packaging/requirements.txt

      - name: Install nfpm (checksum verified)
        run: |
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" nfpm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -f "$archive" checksums.txt

      # Rust transport + PyInstaller + self-test of the frozen program
      - name: Build the bundle
        run: python scripts/build_package.py bundle --native

      - name: tar.gz
        run: python scripts/build_package.py archive --version "$VERSION"

      - name: deb and rpm
        run: python scripts/build_package.py linux --version "$VERSION"

      - name: Package metadata
        run: |
          dpkg-deb --info dist-release/*.deb
          dpkg-deb --contents dist-release/*.deb | head -30

      # Install in clean distribution images: this is what proves the list of dependencies
      - name: Test the deb (Ubuntu 22.04, Debian 12)
        run: |
          for image in ubuntu:22.04 debian:12; do
            echo "::group::$image"
            docker run --rm -e QT_QPA_PLATFORM=offscreen -v "$PWD/dist-release:/pkg:ro" "$image" bash -c '
              set -e
              apt-get update -qq
              apt-get install -y -qq /pkg/*.deb
              /opt/open-lab-automation/ola-selftest --expect-native
              test -x /usr/bin/open-lab-automation
              dpkg -r open-lab-automation
              test ! -e /opt/open-lab-automation/OpenLabAutomation'
            echo "::endgroup::"
          done

      - name: Test the rpm (Fedora)
        run: |
          docker run --rm -e QT_QPA_PLATFORM=offscreen -v "$PWD/dist-release:/pkg:ro" fedora:latest bash -c '
            set -e
            dnf install -y -q /pkg/*.rpm
            /opt/open-lab-automation/ola-selftest --expect-native
            test -x /usr/bin/open-lab-automation
            rpm -e open-lab-automation
            test ! -e /opt/open-lab-automation/OpenLabAutomation'

      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  arch:
    # The PKGBUILD is checked (built and installed in an Arch container), not published.
    name: Arch Linux (PKGBUILD check)
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build and install the package in archlinux
        run: docker run --rm -v "$PWD:/work" archlinux:base-devel bash /work/packaging/arch/ci-check.sh "$GITHUB_SHA"

  publish:
    name: Publish (${{ needs.meta.outputs.kind }})
    needs: [meta, windows, linux]
    # Only main (nightly) and the tags (release) are published; a build of any other branch is not
    if: github.event_name == 'push' && needs.meta.outputs.kind != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.meta.outputs.kind }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KIND: ${{ needs.meta.outputs.kind }}
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          cd release
          sha256sum -- * | grep -v ' SHA256SUMS$' > SHA256SUMS
          cat SHA256SUMS

      - name: Release for the tag
        if: needs.meta.outputs.kind == 'release'
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # a re-run: replace the files of the release
            gh release upload "$TAG" release/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" release/* --repo "$REPO" --verify-tag \
              --title "Open Lab Automation ${TAG#v}" --generate-notes "${flags[@]}"
          fi

      - name: Nightly release (main)
        if: needs.meta.outputs.kind == 'nightly'
        run: |
          # Packages of an older commit must not replace those of a newer one
          latest="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "main moved on to $latest: this build is outdated, not published"
            exit 0
          fi

          # The tag "nightly" always points at the commit that was built
          if gh api "repos/$REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi

          notes="Automatic build of the branch main, updated at every commit. NOT a stable release: use the latest numbered release for work that matters.

          Commit: ${GITHUB_SHA}
          Version: ${VERSION}
          Built: $(date -u +'%Y-%m-%d %H:%M UTC')

          Files: \`SHA256SUMS\` lists the checksums."

          if gh release view nightly --repo "$REPO" >/dev/null 2>&1; then
            # the names of the files contain the version: remove the old ones
            for asset in $(gh release view nightly --repo "$REPO" --json assets --jq '.assets[].name'); do
              gh release delete-asset nightly "$asset" --repo "$REPO" --yes
            done
            gh release edit nightly --repo "$REPO" --title "Nightly (main)" --notes "$notes" --prerelease --latest=false
          else
            gh release create nightly --repo "$REPO" --verify-tag --title "Nightly (main)" \
              --notes "$notes" --prerelease --latest=false
          fi
          gh release upload nightly release/* --repo "$REPO" --clobber
