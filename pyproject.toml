[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "open-lab-automation"
version = "0.0.2"
description = "Open-source suite for automated electrical measurements"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Erik Medeossi" }
]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.0.0",
    "psycopg2-binary>=2.9.0",
    "cryptography>=41.0.0",
    "pyvisa>=1.11.0",
    "pyvisa-py>=0.5.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-qt>=4.0.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
]

[tool.setuptools.packages.find]
include = ["frontend*", "ola*"]

[tool.setuptools.package-data]
frontend = ["appinfo.json", "lang/*.json", "assets/icons/*.png", "assets/styles/*.qss"]
ola = ["modules/*/module.json"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
# Instruments_LIB has its own tests and CI; native/ is tested by its own job
norecursedirs = [".git", "Instruments_LIB", "native", "build", "dist", "*.egg-info", "examples"]
markers = [
    "gui: builds Qt widgets (needs PyQt6 and the offscreen platform)",
]

[tool.isort]
profile = "black"
line_length = 100
