# .deb and .rpm of the frozen bundle, built by nfpm (https://nfpm.goreleaser.com) from
# scripts/build_package.py (step "linux"), always from the root of the repository.
#
# The bundle is self-contained (Python, Qt, numpy... inside), so the packages only depend on the
# system libraries Qt itself needs. The names differ between the distributions: see "overrides".
#
# Installed layout:
#   /opt/open-lab-automation/                       the bundle
#   /usr/bin/open-lab-automation                    link to the program
#   /usr/share/applications/open-lab-automation.desktop
#   /usr/share/icons/hicolor/64x64/apps/open-lab-automation.png

name: open-lab-automation
arch: amd64
platform: linux
# OLA_VERSION is X.Y.Z or X.Y.Z-nightly.YYYYMMDD.sha: nfpm writes the pre-release part with a
# tilde for dpkg (0.0.2~nightly...), so a nightly build sorts before the 0.0.2 release
version: ${OLA_VERSION}
version_schema: semver
section: science
priority: optional
maintainer: Erik Medeossi
description: |-
  Open-source suite for automated electrical measurements.
  Drives bench instruments (power supplies, loads, oscilloscopes, VNAs, generators) through
  SCPI over LAN, serial and GPIB adapters, with a library of instruments and measurement modules.
homepage: https://github.com/mede-erik/Open-Lab-Automation
license: GPL-3.0-only

contents:
  - src: dist-package/OpenLabAutomation
    dst: /opt/open-lab-automation
    type: tree
  - src: /opt/open-lab-automation/OpenLabAutomation
    dst: /usr/bin/open-lab-automation
    type: symlink
  - src: packaging/linux/open-lab-automation.desktop
    dst: /usr/share/applications/open-lab-automation.desktop
    file_info:
      mode: 0644
  - src: frontend/assets/icons/icona.png
    dst: /usr/share/icons/hicolor/64x64/apps/open-lab-automation.png
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/open-lab-automation/copyright
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libegl1
      - libgl1
      - libxkbcommon-x11-0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xinerama0
      - libfontconfig1
      - libdbus-1-3
      - libglib2.0-0
  rpm:
    depends:
      - mesa-libEGL
      - mesa-libGL
      - libxkbcommon-x11
      - xcb-util-cursor
      - xcb-util-wm
      - xcb-util-image
      - xcb-util-keysyms
      - xcb-util-renderutil
      - fontconfig
      - dbus-libs
      - glib2
